name: Tests

# Runs the test suite on every push and pull request.
# SECURITY: this workflow uses NO repository secrets. Pull requests from forks run with
# a read-only token and no secrets, and the database it uses is a throwaway container
# that exists only for this job. (pull_request, never pull_request_target.)
on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless; nothing here writes
# to a real database, so cancelling is safe.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres   # throwaway container, reachable only from this job
          POSTGRES_DB: memphis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d memphis_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Tests that need no database
        run: python -m pytest -m "not db" -v

      # The db fixture in tests/conftest.py refuses any host except localhost / 127.0.0.1 / ::1
      # and anything containing "supabase", and it never reads DATABASE_URL.
      - name: Database tests (throwaway Postgres service)
        shell: bash   # explicit bash turns on pipefail, so a pytest failure is not hidden by tee
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/memphis_test
        run: |
          python -m pytest -m db -v 2>&1 | tee db-tests.log
          # A skipped database test would look green but prove nothing.
          if grep -qi "skipped" db-tests.log; then
            echo "::error::Database tests were skipped; TEST_DATABASE_URL was not picked up."
            exit 1
          fi

  # Builds the pipeline image and checks it. Does NOT run the pipeline (that would need
  # Contentful and database secrets), does NOT log in to any registry, and does NOT push.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read   # same as the workflow default; repeated so this job is self-evident

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Plain `docker build` already uses BuildKit on ubuntu-latest. buildx + a cache action
      # would add two more third-party actions for about a minute of saved time, so it is
      # not used. The second build below reuses the first build's layers anyway.
      - name: Build the test image
        run: docker build --target test --tag pipeline:test .

      # No network, no environment variables, no secrets. The non-database tests need none.
      - name: Run the non-database tests inside the container
        run: docker run --rm --network none pipeline:test

      - name: Build the runtime image
        run: docker build --tag pipeline:runtime .

      # The runtime image's default command (the real pipeline) is never run here;
      # only harmless commands (id, find, python -c ...) are run inside it.
      - name: Smoke checks on the runtime image
        shell: bash
        run: |
          run() { docker run --rm --network none pipeline:runtime "$@"; }
          fail=0
          problem() { echo "::error::$1"; fail=1; }

          echo "--- Runs as non-root"
          configured_user=$(docker image inspect --format '{{.Config.User}}' pipeline:runtime)
          effective_uid=$(run id -u)
          echo "Config.User='$configured_user' effective uid=$effective_uid"
          if [ -z "$configured_user" ] || [ "$configured_user" = "root" ] || [ "$configured_user" = "0" ]; then
            problem "The image is configured to run as root (USER is '$configured_user')."
          fi
          if [ "$effective_uid" = "0" ]; then problem "The container runs as uid 0 (root)."; fi

          echo "--- Every file under /app"
          run find /app -type f | sort

          echo "--- No secrets or generated data"
          env_files=$(run find / -xdev -name '.env*' -not -path '/proc/*' -not -path '/sys/*' 2>/dev/null || true)
          if [ -n "$env_files" ]; then problem "Found .env file(s) in the image: $env_files"; fi
          data_files=$(run find /app/data/raw /app/data/clean -type f)
          if [ -n "$data_files" ]; then problem "Found files in data/raw or data/clean: $data_files"; fi

          echo "--- Test code is not shipped"
          for path in /app/tests /app/scripts /app/pytest.ini /app/requirements-dev.txt; do
            if run test -e "$path"; then problem "$path is in the runtime image."; fi
          done
          if run python -c "import pytest" 2>/dev/null; then problem "pytest is installed in the runtime image."; fi

          echo "--- Required files are present"
          for path in /app/extract.py /app/transform.py /app/load.py /app/sql/create_tables.sql /app/data/reference/groups.json; do
            run test -f "$path" || problem "$path is missing from the image."
          done

          echo "--- Dependencies import and are consistent"
          run python -c "import requests, dotenv, pandas, psycopg2, transform, load" || problem "An import failed."
          run pip check || problem "pip check reported broken dependencies."

          echo "--- Image size"
          docker image ls pipeline:runtime pipeline:test

          exit $fail
